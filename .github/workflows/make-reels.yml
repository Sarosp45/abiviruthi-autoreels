name: Make reels
# Runs when new scripts are added to queue/ (Claude adds a week at a time), or by hand.
on:
  push:
    paths: ["queue/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: autoreels
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -q -r requirements.txt
          python -m playwright install chromium
      - name: Render new reels and send previews
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m poster.jobs make
      - name: Save progress
        if: always()
        run: |
          git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
          git add state.json && git commit -m "Made reels" && git pull --rebase && git push || echo "nothing to save"
